<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viorise Store - Koleksi Fashion</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121214;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- Music Controller --- */
        .music-controller {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .music-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
        }

        .music-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
        }

        .music-status {
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a5;
            letter-spacing: 0.5px;
        }

        /* --- Header & Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 8%;
            background: rgba(18, 18, 20, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            color: #a0a0a5;
            text-decoration: none;
            font-weight: 500;
            margin-left: 25px;
            transition: color 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        nav a:hover, nav a.active-nav {
            color: #ff7eb3;
        }

        .cart-badge {
            background: #ff758c;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
        }

        /* --- Page Sections --- */
        .page-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            min-height: 80vh;
            margin-top: 80px;
        }

        .page-section.active-page {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Hero Section --- */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #2a1b3d 0%, #121214 70%);
            margin-top: 0;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease forwards;
        }

        .hero p {
            font-size: 18px;
            color: #a0a0a5;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .cta-btn {
            padding: 12px 35px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        /* --- Products Section --- */
        .products-container {
            padding: 40px 8%;
        }

        .section-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background: #ff7eb3;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.4s ease, border-color 0.3s, box-shadow 0.4s;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 117, 140, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .product-img-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #1c1c21;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-price {
            font-size: 18px;
            color: #ff7eb3;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .product-card:hover .buy-btn {
            background: white;
            color: #121214;
            border-color: white;
        }

        /* --- Cart Section --- */
        .cart-container {
            padding: 40px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 40px;
            margin-top: 30px;
        }

        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        .cart-items-list {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 15px;
            flex-wrap: wrap;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #1c1c21;
        }

        .cart-item-detail h4 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 4px;
        }

        .cart-item-detail p {
            font-size: 14px;
            color: #ff7eb3;
            font-weight: 500;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: #ff7eb3;
        }

        .delete-item-btn {
            background: transparent;
            border: none;
            color: #ff758c;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .delete-item-btn:hover {
            background: rgba(255, 117, 140, 0.1);
        }

        .cart-summary-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
            color: #a0a0a5;
        }

        .summary-row.total {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }

        .summary-row.total span:last-child {
            color: #ff7eb3;
        }

        .empty-cart-msg {
            text-align: center;
            padding: 50px 20px;
            color: #a0a0a5;
        }

        /* --- Trending / TikTok Section --- */
        .tiktok-container {
            padding: 40px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tiktok-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(325px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            margin-top: 20px;
        }

        .tiktok-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* --- Contact Section --- */
        .contact-container {
            padding: 40px 8%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 40px;
            margin-top: 40px;
            align-items: stretch;
        }

        .contact-form {
            background: rgba(255, 255, 255, 0.02);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a5;
            font-size: 14px;
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #1c1c21;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            border-color: #ff7eb3;
            outline: none;
        }

        .submit-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s;
            font-size: 16px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .map-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .map-title {
            font-size: 18px;
            color: #fff;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .map-wrapper {
            flex: 1;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            height: 100%;
            min-height: 380px;
            background: #1c1c21;
        }

        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- WhatsApp Section --- */
        .whatsapp-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 70vh;
            text-align: center;
            padding: 0 20px;
        }

        .wa-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .wa-icon {
            font-size: 55px;
            margin-bottom: 15px;
            display: inline-block;
            background: #25D366;
            width: 90px;
            height: 90px;
            line-height: 90px;
            border-radius: 50%;
            color: white;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .wa-card h2 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #fff;
        }

        .wa-card p {
            color: #a0a0a5;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .wa-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        /* --- Back to Top --- */
        .back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            z-index: 2000;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .back-to-top.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #666;
            font-size: 14px;
        }

        /* --- Animation --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 4%;
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
                font-size: 14px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .page-section {
                margin-top: 120px;
            }

            .contact-wrapper {
                grid-template-columns: 1fr;
            }

            .map-wrapper {
                min-height: 300px;
            }

            .tiktok-wrapper iframe {
                height: 480px !important;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>

        Browser Anda tidak mendukung pemutar musik.
    

    <div class="music-controller">

    <header>

    <!-- JavaScript Lengkap & Berfungsi -->
    <script>
        // --- Musik ---
        const myAudio = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        const musicStatus = document.getElementById("musicStatus");

        function toggleMusic() {
            if (myAudio.paused) {
                myAudio.play().catch(err => console.log("Klik untuk memutar musik"));
                musicBtn.innerText = "⏸";
                musicStatus.innerText = "Music: ON";
                musicStatus.style.color = "#ff7eb3";
            } else {
                myAudio.pause();
                musicBtn.innerText = "▶";
                musicStatus.innerText = "Music: OFF";
                musicStatus.style.color = "#a0a0a5";
            }
        }

        // --- Navigasi Halaman ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active-page'));
            document.querySelectorAll('nav a').forEach(link => link.classList.remove('active-nav'));

            const targetPage = document.getElementById('page-' + pageId);
            if (targetPage) {
                targetPage.classList.add('active-page');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            const targetNav = document.getElementById('nav-' + pageId);
            if (targetNav) targetNav.classList.add('active-nav');

            if (pageId === 'cart') renderCart();
        }

        // --- Keranjang Belanja ---
        let cart = [];

        function addToCart(name, price, img) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, img, qty: 1 });
            }
            updateBadge();
            alert(`✅ ${name} berhasil ditambahkan!`);
        }

        function updateBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = total;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateBadge();
            renderCart();
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-cart-msg">Keranjang belanja masih kosong.</div>`;
                document.getElementById('subtotalPrice').innerText = formatRupiah(0);
                document.getElementById('totalPrice').innerText = formatRupiah(0);
                return;
            }

            let html = '';
            let subtotal = 0;
            cart.forEach((item, index) => {
                const totalItem = item.price * item.qty;
                subtotal += totalItem;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.img}" class="cart-item-img" alt="${item.name}">
                            <div class="cart-item-detail">
                                <h4>${item.name}</h4>
                                <p>${formatRupiah(item.price)}</p>
                            </div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            <button class="delete-item-btn" onclick="changeQty(${index}, -999)">Hapus</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('subtotalPrice').innerText = formatRupiah(subtotal);
            document.getElementById('totalPrice').innerText = formatRupiah(subtotal);
        }

        // --- Kirim Pesanan ke WhatsApp ---
        function checkoutToWhatsApp(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }

            const nama = document.getElementById('custName').value;
            const hp = document.getElementById('custPhone').value;
            const alamat = document.getElementById('custAddress').value;

            let pesan = `*Pesanan Baru Viorise Store*%0A%0A`;
            pesan += `*Nama:* ${nama}%0A`;
            pesan += `*No HP:* ${hp}%0A`;
            pesan += `*Alamat:* ${alamat}%0A%0A`;
            pesan += `*Daftar Barang:*%0A`;

            let total = 0;
            cart.forEach(item => {
                const jumlah = item.price * item.qty;
                pesan += `- ${item.name} x${item.qty} = ${formatRupiah(jumlah)}%0A`;
                total += jumlah;
            });

            pesan += `%0A*Total Bayar:* ${formatRupiah(total)}%0A`;
            pesan += `*Catatan:* Ongkos kirim dihitung terpisah.`;

            const waLink = `https://wa.me/6288225370995?text=${pesan}`;
            window.open(waLink, '_blank');
        }

        // --- Tombol Kembali ke Atas ---
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTop');
            if (window.scrollY > 300) btn.classList.add('show');
            else btn.classList.remove('show');
        });
    </script>
