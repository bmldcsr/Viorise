
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viorise Store - Premium Style</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Variabel Tema (Dark Mode default) */
        :root {
            --bg-color: #121214;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.05);
            --input-bg: #1c1c21;
            --nav-bg: rgba(18, 18, 20, 0.9);
            --text-muted: #a0a0a5;
        }

        /* Variabel Tema Light Mode */
        [data-theme="light"] {
            --bg-color: #f7f7f9;
            --text-color: #121214;
            --card-bg: rgba(0, 0, 0, 0.02);
            --card-border: rgba(0, 0, 0, 0.08);
            --input-bg: #ffffff;
            --nav-bg: rgba(247, 247, 249, 0.9);
            --text-muted: #66666e;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- Sistem Utilitas Fleksibel --- */
        .controls-group {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Custom Music Toggle Button (Glassmorphism) --- */
        .music-controller, .theme-controller {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        [data-theme="light"] .music-controller, [data-theme="light"] .theme-controller {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .control-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
        }

        .control-status {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* --- Header & Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 8%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            margin-left: 35px;
            transition: color 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        nav a:hover, nav a.active-nav {
            color: #ff7eb3;
        }

        .cart-badge {
            background: #ff758c;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
        }

        /* --- Sistem Slide Halaman Baru (Page Engine) --- */
        .page-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            min-height: 80vh;
            margin-top: 80px;
        }

        .page-section.active-page {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Hero Section (Halaman Home) --- */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #2a1b3d 0%, var(--bg-color) 70%);
            margin-top: 0px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease forwards;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 30px;
        }

        .cta-btn {
            padding: 12px 35px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        /* --- Products Section --- */
        .products-container {
            padding: 40px 8%;
        }

        .section-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background: #ff7eb3;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* --- Product Card --- */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, box-shadow 0.4s;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 117, 140, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .product-img-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #1c1c21;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .product-price {
            font-size: 18px;
            color: #ff7eb3;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        [data-theme="light"] .buy-btn {
            border: 2px solid rgba(0, 0, 0, 0.15);
        }

        .product-card:hover .buy-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border-color: transparent;
        }

        /* --- TikTok Section Styling --- */
        .tiktok-container {
            padding: 40px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tiktok-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(325px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            margin-top: 20px;
        }

        .tiktok-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* --- Halaman Contact --- */
        .contact-container {
            padding: 40px 8%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }

        .contact-form {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #ff7eb3;
            outline: none;
        }

        .submit-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .map-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            height: 100%;
            min-height: 300px;
        }

        /* --- Fitur Baru: Toast Notification Component --- */
        #toastContainer {
            position: fixed;
            top: 100px;
            right: 25px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-box {
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(15px);
